name: daily-sync

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Sync Douban (incremental)
        id: douban
        env:
          DOUBAN_USER: pei830
          DOUBAN_OUTPUT_DIR: ${{ github.workspace }}/data
        run: node scripts/douban-sync/douban-incremental.mjs

      - name: Enrich Douban ratings (new items)
        if: steps.douban.outputs.new_count != '' && steps.douban.outputs.new_count != '0'
        env:
          DOUBAN_USER: pei830
          DOUBAN_OUTPUT_DIR: ${{ github.workspace }}/data
        run: node scripts/douban-sync/douban-enrich.mjs

      - name: Sync project statuses from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/projects-sync/projects-sync.mjs

      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(daily-sync): sync douban & projects'
          file_pattern: 'data/** src/content/projects/**'

      - name: Trigger deploy
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
