# 站点 CI：七过程清单（typecheck/test/build/package/publish/deploy/sync），
# push master 即构建部署；deploy 为独立 job（官方 Pages artifact 交接）。
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check (astro check)
        run: pnpm run check

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "test 空跑（静态站点无单元测试）"

  build:
    name: build
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  package:
    name: package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "package 空跑（静态站点无发布包）"

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "publish 空跑（无市场/npm 发布，上线即部署）"

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  sync:
    name: sync
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "sync 空跑（实际数据同步在 daily-sync.yml 定时执行）"
