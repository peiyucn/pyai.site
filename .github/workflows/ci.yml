name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint + repository policy)
        run: pnpm run lint
      - name: Typecheck (astro check)
        run: pnpm run check
      - name: Typecheck policy tests
        run: pnpm run typecheck:policy
      - name: Policy negative fixtures
        run: pnpm run test:report
      - name: Release gate self-test
        run: pnpm run test:gate
      - name: Build
        run: pnpm run build
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-report.xml
          retention-days: 7
